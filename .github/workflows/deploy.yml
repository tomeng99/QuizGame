name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev

env:
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/quizgame-server
  CLIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/quizgame-client
  EXPO_PUBLIC_API_URL: ${{ github.ref_name == 'main' && secrets.PROD_EXPO_PUBLIC_API_URL || secrets.DEV_EXPO_PUBLIC_API_URL }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: image-tag
        run: |
          echo "deploy=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "rolling=${GITHUB_REF_NAME}-latest" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ steps.image-tag.outputs.rolling }}
            ${{ env.SERVER_IMAGE }}:${{ steps.image-tag.outputs.deploy }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/client/Dockerfile
          push: true
          tags: |
            ${{ env.CLIENT_IMAGE }}:${{ steps.image-tag.outputs.rolling }}
            ${{ env.CLIENT_IMAGE }}:${{ steps.image-tag.outputs.deploy }}
          build-args: |
            EXPO_PUBLIC_API_URL=${{ env.EXPO_PUBLIC_API_URL }}
