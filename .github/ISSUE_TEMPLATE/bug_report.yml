name: Bug report
about: Report a bug or unexpected behavior in QuizGame
title: "[Bug]: "
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the fields
        below so we can reproduce and fix the issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior. Include any relevant code or config.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform did the bug occur on?
      options:
        - Web
        - iOS
        - Android
        - Other
      default: 0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Browser / App version
      description: The browser (and version) or the app build you were using.
      placeholder: e.g. Chrome 125, Safari 17, Expo build 1.2.3
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Add screenshots or screen recordings to help explain the problem.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Anything else that might help — logs, related issues, environment details, etc.
    validations:
      required: false
